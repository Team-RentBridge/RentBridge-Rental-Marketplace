services:
  - type: web
    name: rentbridge-backend
    runtime: java
    region: oregon
    plan: free
    rootDir: springboot-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/rentbridge-backend-1.0.0.jar
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://rentbridge-frontend.onrender.com

  - type: web
    name: rentbridge-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -p 3000
    envVars:
      - key: REACT_APP_API_URL
        value: https://rentbridge-backend-55yi.onrender.com/api
      - key: REACT_APP_RAZORPAY_KEY_ID
        sync: false
